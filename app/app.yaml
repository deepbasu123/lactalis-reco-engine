# Databricks Apps runtime config for the Lactalis Reco Engine.
# The server is dependency-light (express only); the React app is pre-built into
# frontend/dist and shipped with the source, so no build runs at deploy time.
command: ['node', 'server/index.js']

env:
  - name: 'NODE_ENV'
    value: 'production'

  # SQL warehouse that serves the gold/reco layer. `valueFrom` binds to the
  # App resource keyed `sql-warehouse` (add it in the App UI / bundle); the
  # value it injects is the warehouse id.
  - name: 'DATABRICKS_WAREHOUSE_ID'
    valueFrom: 'sql-warehouse'

  # Unity Catalog location of the reco schema.
  - name: 'RECO_CATALOG'
    value: 'lactalis_catalog'
  - name: 'RECO_SCHEMA'
    value: 'reco'

  # Optional. Set once the Genie space and Lakeview dashboard exist. The UI
  # degrades gracefully when these are empty.
  - name: 'GENIE_SPACE_ID'
    value: '01f19226397110aabc5e5b1832212b30'
  - name: 'DASHBOARD_ID'
    value: '01f19227a9a41291b8544defb7f70c90'

# NOTE on auth: the Databricks Apps runtime automatically injects the service
# principal OAuth credentials (DATABRICKS_CLIENT_ID / DATABRICKS_CLIENT_SECRET)
# and DATABRICKS_HOST. server/auth.js detects those and uses M2M OAuth in
# production, falling back to DATABRICKS_TOKEN or a CLI profile locally.

# Databricks Apps runtime config for the Lactalis Reco Engine.
#
# This file is a TEMPLATE for local reference. deploy.py generates the real one at
# deploy time with your catalog, schema, Genie space id and dashboard id filled in,
# and uploads that generated version alongside the source. Editing this file by hand
# has no effect on a deploy.py deployment.
#
# The server is dependency-light (express only) and the React app is pre-built into
# frontend/dist, so the Apps runtime only has to `npm install` and start Node.
command: ['node', 'server/index.js']

env:
  - name: 'NODE_ENV'
    value: 'production'

  # Injected from the app's `sql-warehouse` resource, which deploy.py attaches when
  # it creates the app. Without that resource the app has no warehouse to query.
  - name: 'DATABRICKS_WAREHOUSE_ID'
    valueFrom: 'sql-warehouse'

  # Unity Catalog location of the reco schema.
  - name: 'RECO_CATALOG'
    value: 'lactalis_catalog'
  - name: 'RECO_SCHEMA'
    value: 'reco'

  # Filled in by deploy.py. Empty here so a hand-deployed copy degrades gracefully
  # instead of pointing at someone else's workspace objects.
  - name: 'GENIE_SPACE_ID'
    value: ''
  - name: 'DASHBOARD_ID'
    value: ''

# Auth: the Databricks Apps runtime injects the service principal OAuth credentials
# (DATABRICKS_CLIENT_ID / DATABRICKS_CLIENT_SECRET) and DATABRICKS_HOST. server/auth.js
# detects those and uses M2M OAuth in production, falling back to DATABRICKS_TOKEN or a
# CLI profile locally.
